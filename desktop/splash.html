<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BOSS 求职助手</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #f8fafc; font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif; }
    .card { width: min(480px, calc(100vw - 48px)); padding: 36px; border: 1px solid #334155; border-radius: 18px; background: #1e293b; box-shadow: 0 24px 70px #0005; }
    .icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: #00be68; font-size: 24px; }
    h1 { font-size: 22px; margin: 22px 0 10px; }
    p { margin: 0; color: #94a3b8; line-height: 1.7; }
    .bar { height: 4px; margin-top: 28px; border-radius: 4px; background: #334155; overflow: hidden; }
    .bar::after { content: ""; display: block; width: 35%; height: 100%; background: #00be68; border-radius: inherit; animation: move 1.4s ease-in-out infinite alternate; }
    @keyframes move { from { transform: translateX(0); } to { transform: translateX(185%); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">◈</div>
    <h1>BOSS 求职助手</h1>
    <p>正在连接本地服务，请稍候…</p>
    <div class="bar"></div>
  </div>
</body>
</html>
