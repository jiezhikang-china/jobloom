<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拾职 · Jobloom</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #faf9f5; color: #141413; font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif; }
    .card { width: min(480px, calc(100vw - 48px)); padding: 36px; border: 1px solid #e5e3d9; border-radius: 18px; background: #fffefc; box-shadow: 0 24px 70px #1414130a; }
    .icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: #f5e9e2; color: #ad4d31; font-size: 24px; }
    h1 { font-size: 22px; margin: 22px 0 10px; }
    p { margin: 0; color: #66645f; line-height: 1.7; }
    .bar { height: 4px; margin-top: 28px; border-radius: 4px; background: #e5e3d9; overflow: hidden; }
    .bar::after { content: ""; display: block; width: 35%; height: 100%; background: #d97757; border-radius: inherit; animation: move 1.4s ease-in-out infinite alternate; }
    @keyframes move { from { transform: translateX(0); } to { transform: translateX(185%); } }
    @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; } }
  </style>
</head>
<body>
  <div class="card">
    <img class="icon" src="assets/jobloom-icon.png" alt="" width="44" height="44">
    <h1>拾职 · Jobloom</h1>
    <p>正在连接本地服务，请稍候…</p>
    <div class="bar"></div>
  </div>
</body>
</html>
